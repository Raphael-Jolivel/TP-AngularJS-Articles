<div class="login-page-container">
  <div class="login-card-modern">
    <h1 class="login-title-modern">
      <span>Réinitialiser votre mot de passe</span>
    </h1>
    <form #form="ngForm">
      <div>
        <label for="email">Email</label>
        <input
          id="email"
          name="email"
          [(ngModel)]="user.email"
          placeholder="Entrez votre email"
          type="email"
          #email="ngModel"
          required
          email
        />
        <div class="custom-alert-danger" *ngIf="email.invalid && (email.dirty || email.touched)">
          <div *ngIf="email.errors?.['required']">Email requis</div>
          <div *ngIf="email.errors?.['email']">Email invalide</div>
        </div>
      </div>
      <button class="login-btn-modern" style="margin-top: 1.2rem;" [disabled]="form.invalid" (click)="sendFormData()">
        Réinitialiser le mot de passe
      </button>
      <p class="uk-text-meta uk-text-center uk-margin-top">
        Compte déjà existant ? <a [routerLink]="['/login']" class="uk-link-text">Se connecter &rarr;</a>
      </p>
    </form>
  </div>
</div>
